name: CodeBar

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.princemiller.CodeBar
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Without this, `Color.accentColor` resolves to whatever the user picked in
    # System Settings — so CodeBar's selection, pin state and links changed
    # identity per machine, and could land on the same orange the app uses for
    # "not billable".
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CodeCore:
    path: Packages/CodeCore
  CodeStore:
    path: Packages/CodeStore
  CodeBarUI:
    path: Packages/CodeBarUI
  CodePlatform:
    path: Packages/CodePlatform
  CodeLibrary:
    path: Packages/CodeLibrary

targets:
  CodeBar:
    type: application
    platform: macOS
    settings:
      base:
        # Required for notarization, and harmless before it: it restricts the
        # process (no unsigned code injection, no DYLD overrides) rather than
        # changing what the app may do. Turning it on now means the first signed
        # build is not also the first build under a different runtime.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          # Xcode otherwise injects com.apple.security.get-task-allow, which lets
          # a debugger attach. Apple's notarization requirements name it
          # explicitly as disqualifying, so a Release build carrying it is
          # rejected — on the day of the first release, having looked fine until
          # then. Verified absent with `codesign -d --entitlements`.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    sources:
      - path: CodeBar
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: CodeCore
      - package: CodeStore
      - package: CodeBarUI
      - package: CodePlatform
      - package: CodeLibrary
    # RegisterEventHotKey needs no entitlement and works sandboxed, which is what
    # made turning the sandbox on possible. NSOpenPanel keeps working because
    # Powerbox grants access to whatever file the user picks.
    entitlements:
      path: CodeBar/CodeBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: CodeBar/Info.plist
      properties:
        CFBundleName: CodeBar
        CFBundleDisplayName: CodeBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Deliberately absent: LSUIElement would make the app launch as an
        # accessory, so SwiftUI never builds the main window and opening the app
        # has nothing to show. Menu-bar-only is a preference applied at launch
        # instead — see ActivationPolicyController.
        NSHumanReadableCopyright: "© 2026 Prince Miller"
    scheme:
      testTargets:
        - CodeBarUITests

  # Interaction coverage. Every window and panel defect so far was found by
  # running a build and looking at it; these drive the real app instead.
  CodeBarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: CodeBar
    settings:
      base:
        TEST_TARGET_NAME: CodeBar
        GENERATE_INFOPLIST_FILE: YES
