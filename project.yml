name: CodeBar

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.princemiller.CodeBar
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CodeCore:
    path: Packages/CodeCore
  CodeStore:
    path: Packages/CodeStore
  CodeBarUI:
    path: Packages/CodeBarUI
  CodePlatform:
    path: Packages/CodePlatform

targets:
  CodeBar:
    type: application
    platform: macOS
    sources:
      - path: CodeBar
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: CodeCore
      - package: CodeStore
      - package: CodeBarUI
      - package: CodePlatform
    # RegisterEventHotKey needs no entitlement and works sandboxed, which is what
    # made turning the sandbox on possible. NSOpenPanel keeps working because
    # Powerbox grants access to whatever file the user picks.
    entitlements:
      path: CodeBar/CodeBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: CodeBar/Info.plist
      properties:
        CFBundleName: CodeBar
        CFBundleDisplayName: CodeBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar-only: no Dock icon, no Cmd-Tab entry.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Prince Miller"
